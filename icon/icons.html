<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:transparent}
.ic{position:relative;width:1024px;height:1024px;overflow:hidden}
/* macOS squircle plate, 824px like Apple's grid, centred */
.plate{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:186px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.plastic{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%),
  linear-gradient(180deg, var(--hi) 0%, var(--c) 48%, var(--lo) 100%)}
.rim{position:absolute;inset:0;border-radius:186px;box-shadow:inset 0 0 0 10px rgba(255,255,255,.35), inset 0 -28px 50px rgba(0,0,0,.22), inset 0 30px 50px rgba(255,255,255,.35)}
.streak{position:absolute;left:70px;top:46px;width:560px;height:60px;border-radius:40px;background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.75) 30%,rgba(255,255,255,.75) 70%,rgba(255,255,255,0));filter:blur(4px)}
/* the CRT bezel + glass */
.bezel{position:absolute;left:112px;top:122px;width:600px;height:470px;border-radius:70px;background:linear-gradient(180deg,#2a3340,#111822);box-shadow:inset 0 6px 14px rgba(255,255,255,.18), 0 10px 26px rgba(0,0,0,.35)}
.glass{position:absolute;left:36px;top:34px;width:528px;height:402px;border-radius:46px;overflow:hidden;background:#3e6fb0}
.desk{position:absolute;inset:0;background:linear-gradient(180deg,#4f84c6,#2e5a9b)}
.win{position:absolute;left:44px;top:46px;width:440px;height:310px;background:#eeeeee;border:5px solid #000;border-radius:3px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.tb{height:38px;background:repeating-linear-gradient(180deg,#ddd 0 3px,#eee 3px 6px);border-bottom:5px solid #000;position:relative}
.tb b{position:absolute;left:0;right:0;top:3px;text-align:center;font:700 26px/32px 'Chicago','Geneva','Helvetica Neue',sans-serif;background:#eee;margin:0 150px}
.tb i{position:absolute;top:8px;width:22px;height:22px;background:#eee;border:4px solid #000;box-sizing:border-box}
.log{padding:16px 20px;font:30px/40px 'Geneva','Helvetica Neue',sans-serif;color:#111}
.log span{color:#1d2bd8;font-weight:700}
.log em{color:#777;font-style:normal;font-size:24px}
.face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 5px,rgba(0,0,0,.09) 5px 7px);pointer-events:none}
.shine{position:absolute;inset:0;background:radial-gradient(60% 40% at 25% 8%,rgba(255,255,255,.45),rgba(255,255,255,0) 60%)}
/* the pill */
.pill{position:absolute;left:112px;top:632px;width:600px;height:96px;border-radius:48px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.1));box-shadow:inset 0 0 0 8px rgba(255,255,255,.3), 0 8px 18px rgba(0,0,0,.18)}
.pill .fld{position:absolute;left:92px;top:18px;width:390px;height:60px;border-radius:30px;background:rgba(255,255,255,.78);box-shadow:inset 0 4px 8px rgba(0,0,0,.08)}
.pill .fld:after{content:'';position:absolute;left:34px;top:16px;width:5px;height:28px;background:#1a1a1a}
.pill .go{position:absolute;right:14px;top:10px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dff4ff,#6fb6d8 60%,#3f8fb7);box-shadow:inset 0 0 0 6px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.2)}
.pill .go:after{content:'↑';position:absolute;inset:0;text-align:center;font:700 52px/76px 'Helvetica Neue',sans-serif;color:#fff}
.pill .apple{position:absolute;left:30px;top:26px;width:44px;height:44px}
</style>
<body>
<div class="ic" id="A" style="--c:#3faac4;--hi:#9fe0ee;--lo:#1f7b96">
 <div class="plate"><div class="plastic"></div><div class="streak"></div><div class="rim"></div>
  <div class="bezel"><div class="glass"><div class="desk"></div>
   <div class="win"><div class="tb"><i style="left:8px"></i><b>Claude</b><i style="right:8px"></i></div>

   <div class="scan"></div><div class="shine"></div></div></div>
  <div class="pill"><svg class="apple" viewBox="0 0 24 24"><path fill="rgba(0,0,0,.55)" d="M16.4 12.7c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.8-1.7 0-3.2 1-4.1 2.5-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.2-1.2 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.9-4zM14 5.3c.7-.8 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg><div class="fld"></div><div class="go"></div></div>
 </div>
</div>

 <div class="plate"><div class="plastic"></div><div class="streak"></div><div class="rim"></div>
  <div class="bezel" style="left:92px;top:132px;width:640px;height:560px;border-radius:84px"><div class="glass" style="width:568px;height:492px;border-radius:56px"><div class="desk"></div>
   <svg class="face" width="330" height="330" viewBox="0 0 24 24" shape-rendering="crispEdges">
    <rect x="4" y="2" width="16" height="18" fill="#efe9d8" stroke="#111" stroke-width="1"/>
    <rect x="6" y="4" width="12" height="9" fill="#eef4ff" stroke="#111" stroke-width="1"/>
    <rect x="9" y="6" width="1" height="2" fill="#111"/><rect x="14" y="6" width="1" height="2" fill="#111"/>
    <rect x="9" y="10" width="1" height="1" fill="#111"/><rect x="10" y="11" width="4" height="1" fill="#111"/><rect x="14" y="10" width="1" height="1" fill="#111"/>
    <rect x="11" y="4" width="2" height="2" fill="#111" opacity=".9"/>
    <rect x="6" y="15" width="7" height="1" fill="#111"/><rect x="16" y="15" width="2" height="1" fill="#111"/>
    <rect x="7" y="20" width="10" height="2" fill="#111"/>
   </svg>
   <div class="scan"></div><div class="shine"></div></div></div>
 </div>
</div>
<div class="ic" id="C" style="--c:#f05c8a;--hi:#ffb6cf;--lo:#b8305e">
 <div class="plate"><div class="plastic"></div><div class="streak"></div><div class="rim"></div>
  <div class="bezel"><div class="glass"><div class="desk"></div>
   <div class="win"><div class="tb"><i style="left:8px"></i><b>Claude</b><i style="right:8px"></i></div>
    <div class="log"><em>(9:41 PM)</em> <span>Claude:</span> hi, what are we making tonight?</div></div>
   <div class="scan"></div><div class="shine"></div></div></div>
  <div class="pill"><svg class="apple" viewBox="0 0 24 24"><path fill="rgba(0,0,0,.55)" d="M16.4 12.7c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.8-1.7 0-3.2 1-4.1 2.5-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.2-1.2 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.9-4zM14 5.3c.7-.8 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg><div class="fld"></div><div class="go" style="background:radial-gradient(circle at 35% 30%,#ffe3ec,#f07aa0 60%,#c54a74)"></div></div>
 </div>
</div>
</body>
